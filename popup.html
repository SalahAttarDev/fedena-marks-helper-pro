<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Marks Helper Pro</title>
<style>
body{width:280px;margin:0;font:13px/1.45 "Segoe UI",system-ui,Arial,sans-serif;color:#151C28;background:#fff}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#26307A;color:#fff;border-bottom:4px solid;border-image:linear-gradient(90deg,#26307A 0 43%,#1E8A45 43% 71%,#C8322E 71% 86%,#B8923A 86%) 1}
header img{width:28px;height:28px;border-radius:6px;background:#fff}
header b{font-size:14px}
main{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
p{margin:0;color:#5A6272}
ol{margin:0;padding-left:18px;color:#5A6272}
button{border:0;border-radius:8px;padding:9px;background:#26307A;color:#fff;font-weight:600;cursor:pointer;font:inherit}
button:focus-visible{outline:3px solid #B8923A;outline-offset:2px}
</style></head>
<body>
<header><img src="icons/icon-32.png" alt=""><b>Marks Helper Pro</b></header>
<main>
  <p id="msg">Checking this tab…</p>
  <ol>
    <li>Open <b>Enter marks</b> for a subject and batch.</li>
    <li>Drop your CA tracker or CSV on the panel.</li>
    <li>Check, fill, then click <b>Submit Marks</b>.</li>
    <li>Reopen the page to verify what was saved.</li>
  </ol>
  <button id="go" type="button">Open Gradebook</button>
</main>
<script src="popup.js"></script>
</body></html>
